name: issue-29-hf-native-materialization

on:
  pull_request:
    paths:
      - "tools/provider_adapters/hf_native.py"
      - "tools/materialize_hf_observation.py"
      - "tests/test_hf_materialization.py"
      - "schemas/hf-materialization-receipt-v1.schema.json"
      - "fixtures/materialization/**"
      - "docs/hf-native-materialization.md"
      - ".github/workflows/issue-29-hf-native-materialization.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  deterministic-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install pytest
      - name: Run offline materialization tests
        run: python -m pytest tests/test_hf_materialization.py -v

  live-native-cache-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install pinned Hugging Face Hub client
        run: python -m pip install huggingface_hub==1.29.0
      - name: Prove exact-revision materialize then cache-hit
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          set -euo pipefail
          cache_dir="$RUNNER_TEMP/hf-native-cache"
          observation="fixtures/materialization/hf-tiny-random-vit-observation.json"
          first="$RUNNER_TEMP/first-receipt.json"
          second="$RUNNER_TEMP/second-receipt.json"

          python tools/materialize_hf_observation.py \
            --observation "$observation" \
            --cache-dir "$cache_dir" \
            --allow-network \
            --output "$first"

          python tools/materialize_hf_observation.py \
            --observation "$observation" \
            --cache-dir "$cache_dir" \
            --output "$second"

          python - "$first" "$second" <<'PY'
          import json, pathlib, sys
          first = json.loads(pathlib.Path(sys.argv[1]).read_text())
          second = json.loads(pathlib.Path(sys.argv[2]).read_text())
          revision = "d4ddddabea80a187f3adce69c76ab017d2cf9a86"
          assert first["source_revision"] == revision
          assert second["source_revision"] == revision
          assert first["materialization"]["outcome"] == "materialized"
          assert second["materialization"]["outcome"] == "cache_hit"
          assert first["materialization"]["native_handle"] == second["materialization"]["native_handle"]
          assert first["verification"]["status"] == "verified_structure"
          assert second["verification"]["status"] == "verified_structure"
          assert first["verification"]["files_checked"] == 1
          assert second["verification"]["files_checked"] == 1
          PY

          test -f "$cache_dir/models--optimum-intel-internal-testing--tiny-random-vit/snapshots/d4ddddabea80a187f3adce69c76ab017d2cf9a86/config.json"
