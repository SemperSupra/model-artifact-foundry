name: Verify approved SigLIP2 base patch16-224

on:
  pull_request:
    paths:
      - ".github/workflows/verify-approved-siglip2-base-patch16-224.yml"
      - "catalog/approved.json"
      - "schemas/approved-catalog.schema.json"
      - "tools/hydrate.py"
  push:
    branches:
      - main
    paths:
      - "catalog/approved.json"

permissions:
  contents: read

env:
  LOGICAL_ID: embed/siglip2/base-patch16-224
  EXPECTED_DIGEST: sha256:c93e953d44105c8cd59be4b893acee43858e9fcb8b4deb20f83535a2165c1c3d
  EXPECTED_REVISION: 75de2d55ec2d0b4efc50b3e9ad70dba96a7b2fa2
  EVIDENCE_COMMIT: 12951b8cb0717a78dc81e7b70345c3cf4c5025fe
  EVIDENCE_PATH: candidates/embed-siglip2-base-patch16-224/75de2d55ec2d0b4efc50b3e9ad70dba96a7b2fa2/7304a77647a551f6345853b34faebbe0931d7c29/candidate.json

jobs:
  validate-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - name: Validate exact approved catalog binding
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-input "jsonschema==4.25.1"
          python3 - <<'PY'
          import json
          from pathlib import Path
          import jsonschema

          schema = json.loads(Path("schemas/approved-catalog.schema.json").read_text())
          catalog = json.loads(Path("catalog/approved.json").read_text())
          jsonschema.validate(catalog, schema)
          entry = catalog["artifacts"]["embed/siglip2/base-patch16-224"]
          assert entry["oci_repository"] == "ghcr.io/sempersupra/model-artifact-foundry"
          assert entry["approved_digest"] == "sha256:c93e953d44105c8cd59be4b893acee43858e9fcb8b4deb20f83535a2165c1c3d"
          assert entry["upstream_exact_revision"] == "75de2d55ec2d0b4efc50b3e9ad70dba96a7b2fa2"
          assert entry["license_spdx_id"] == "Apache-2.0"
          assert entry["candidate_evidence"] == {
              "repository": "SemperSupra/model-artifact-foundry",
              "commit_sha": "12951b8cb0717a78dc81e7b70345c3cf4c5025fe",
              "manifest_path": "candidates/embed-siglip2-base-patch16-224/75de2d55ec2d0b4efc50b3e9ad70dba96a7b2fa2/7304a77647a551f6345853b34faebbe0931d7c29/candidate.json",
          }
          assert entry["approved_at"]
          PY
          python3 -m py_compile tools/hydrate.py

  hydrate-approved:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate-catalog
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Set up ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        with:
          version: 1.3.3

      - name: Install bounded SigLIP2 validation runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-input \
            "pillow==12.3.0" \
            "transformers==5.16.1" \
            "torch==2.14.0"

      - name: Login to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "${GHCR_TOKEN}" | oras login ghcr.io \
            --username "${GITHUB_ACTOR}" \
            --password-stdin

      - name: Hydrate fresh cache from approved selector
        id: hydrate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/foundry-siglip2-approved
          MODEL1="$(python3 tools/hydrate.py \
            --catalog catalog/approved.json \
            --id "${LOGICAL_ID}" \
            --cache-root /tmp/foundry-siglip2-approved | tail -n1)"
          test -d "${MODEL1}"
          MODEL2="$(python3 tools/hydrate.py \
            --catalog catalog/approved.json \
            --id "${LOGICAL_ID}" \
            --cache-root /tmp/foundry-siglip2-approved \
            --oras /bin/false | tail -n1)"
          test "${MODEL1}" = "${MODEL2}"
          echo "model_dir=${MODEL2}" >> "${GITHUB_OUTPUT}"

      - name: Prove offline local image/text embedding smoke
        shell: bash
        env:
          MODEL_DIR: ${{ steps.hydrate.outputs.model_dir }}
        run: |
          set -euo pipefail
          export HF_HUB_OFFLINE=1
          export TRANSFORMERS_OFFLINE=1
          python3 - <<'PY'
          import math
          import os
          from pathlib import Path
          import PIL.Image
          import torch
          from transformers import AutoModel, AutoProcessor

          model_dir = Path(os.environ["MODEL_DIR"])
          model = AutoModel.from_pretrained(str(model_dir), local_files_only=True, trust_remote_code=False)
          processor = AutoProcessor.from_pretrained(str(model_dir), local_files_only=True, trust_remote_code=False)
          image = PIL.Image.new("RGB", (100, 100), color=(128, 64, 200))
          inputs = processor(text=["a purple square", "a blue circle"], images=[image], padding="max_length", return_tensors="pt")
          with torch.no_grad():
              outputs = model(**inputs)
          image_embeds = outputs.image_embeds
          text_embeds = outputs.text_embeds
          assert tuple(image_embeds.shape) == (1, 768), tuple(image_embeds.shape)
          assert tuple(text_embeds.shape) == (2, 768), tuple(text_embeds.shape)
          assert torch.isfinite(image_embeds).all().item()
          assert torch.isfinite(text_embeds).all().item()
          print({"image_shape": tuple(image_embeds.shape), "text_shape": tuple(text_embeds.shape), "torch": torch.__version__})
          PY

      - name: Record approved consumer-ready proof
        shell: bash
        run: |
          {
            echo "## Approved SigLIP2 artifact is consumer-ready"
            echo
            echo "- logical ID: \`${LOGICAL_ID}\`"
            echo "- digest: \`${EXPECTED_DIGEST}\`"
            echo "- upstream revision: \`${EXPECTED_REVISION}\`"
            echo "- fresh approved-selector hydration: passed"
            echo "- second hydration with ORAS disabled: passed"
            echo "- local-only image/text embedding smoke: passed"
          } >> "${GITHUB_STEP_SUMMARY}"
