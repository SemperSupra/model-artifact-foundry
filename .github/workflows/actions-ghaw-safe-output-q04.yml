name: Actions gh-aw safe-output compiler Q0.5
on:
  push:
    branches:
      - exp/actions-ghaw-safe-output-q04-20260908
permissions:
  contents: read
jobs:
  compile-safe-output:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install gh-aw
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh extension install github/gh-aw
          gh aw version
      - name: Compile and inspect persisted authority graph
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh aw compile q04-safe-output
          test -f .github/workflows/q04-safe-output.lock.yml
          echo '--- compiled lock workflow ---'
          sed -n '1,520p' .github/workflows/q04-safe-output.lock.yml
          echo '--- authority markers ---'
          grep -nEi 'permissions:|issues:|safe[_-]?output|create.issue|create-issue|write|agent' .github/workflows/q04-safe-output.lock.yml || true
          echo '--- git status ---'
          git status --short
