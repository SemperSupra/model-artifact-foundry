name: Actions gh-aw safe-output compiler Q0.4
on:
  push:
    branches:
      - exp/actions-ghaw-safe-output-q04-20260908
permissions:
  contents: read
jobs:
  compile-safe-output:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install gh-aw
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh extension install github/gh-aw
          gh aw version
      - name: Validate and inspect safe-output compilation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh aw validate .github/workflows/q04-safe-output.md
          echo '--- generated .github/aw files ---'
          find .github/aw -maxdepth 4 -type f -print -exec sh -c 'echo "===== $1 ====="; sed -n "1,320p" "$1"' _ {} \; || true
          echo '--- git status ---'
          git status --short
          echo '--- authority markers across generated artifacts ---'
          grep -RniE 'safe[_-]?output|issues:|permissions:|create.issue|create-issue|write' .github/aw .github/workflows/q04-safe-output.md || true
