name: issue-35-request-result-contract

on:
  pull_request:
    paths:
      - 'schemas/model-request-v1.schema.json'
      - 'schemas/model-plan-result-v1.schema.json'
      - 'fixtures/request/**'
      - 'tools/model_request_contract.py'
      - 'tests/test_model_request_contract.py'
      - 'docs/model-request-result-v1.md'
      - '.github/workflows/issue-35-request-result-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          check-latest: false
      - name: Install test runner
        run: python -m pip install pytest
      - name: Run request/result contract tests
        run: python -m pytest tests/test_model_request_contract.py -v
      - name: Prove canonical request byte and digest repeatability
        shell: bash
        run: |
          set -euo pipefail
          fixture="fixtures/request/ui-grounding-request.example.json"
          first="$RUNNER_TEMP/request-first.json"
          second="$RUNNER_TEMP/request-second.json"
          python tools/model_request_contract.py request --input "$fixture" --output "$first"
          python tools/model_request_contract.py request --input "$fixture" --output "$second"
          cmp "$first" "$second"
          digest1="$(python tools/model_request_contract.py digest --input "$first")"
          digest2="$(python tools/model_request_contract.py digest --input "$second")"
          test "$digest1" = "$digest2"
          python -m json.tool schemas/model-request-v1.schema.json >/dev/null
          python -m json.tool schemas/model-plan-result-v1.schema.json >/dev/null
