name: Actions safe-output composition Q0.7

on:
  push:
    branches:
      - exp/actions-safe-output-composition-q07-20260908
  workflow_dispatch:

permissions:
  contents: read

jobs:
  producer:
    runs-on: ubuntu-slim
    outputs:
      projection_id: ${{ steps.meta.outputs.projection_id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - name: Produce bounded safe output
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/q07
          cat > /tmp/q07/request.json <<'EOF'
          {"action":"drain_backlog","resource":"resource:alpha","expected":{"worker":"alive","backlog":2},"patch":{"backlog":0},"projection_id":"q07-alive-2"}
          EOF
          printf '%s\n' '{"projection_id":"q07-alive-2","resource":"resource:alpha","worker":"alive","backlog":2,"allowed_actions":["restart_worker","drain_backlog","no_action"]}' > /tmp/q07/projection.json
          sha256sum /tmp/q07/request.json /tmp/q07/projection.json
          echo 'projection_id=q07-alive-2' >> "$GITHUB_OUTPUT"
      - name: Upload producer artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: q07-producer
          path: /tmp/q07/
          retention-days: 1

  receiver:
    needs: producer
    runs-on: ubuntu-slim
    outputs:
      accepted: ${{ steps.validate.outputs.accepted }}
      action: ${{ steps.validate.outputs.action }}
      normalized_digest: ${{ steps.validate.outputs.normalized_digest }}
    steps:
      - name: Download producer artifact
        uses: actions/download-artifact@v4
        with:
          name: q07-producer
          path: /tmp/q07
      - name: Validate immutable candidate
        id: validate
        shell: bash
        env:
          EXPECTED_PROJECTION_ID: ${{ needs.producer.outputs.projection_id }}
          PRODUCER_ARTIFACT_DIGEST: ${{ needs.producer.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          root = Path('/tmp/q07')
          request_raw = (root/'request.json').read_bytes()
          projection = json.loads((root/'projection.json').read_text())
          request = json.loads(request_raw)
          required = {'action','resource','expected','patch','projection_id'}
          assert set(request) == required
          assert request['projection_id'] == os.environ['EXPECTED_PROJECTION_ID'] == projection['projection_id']
          assert request['resource'] == projection['resource']
          assert request['expected'] == {'worker':projection['worker'],'backlog':projection['backlog']}
          assert request['action'] in projection['allowed_actions']
          if projection['worker'] == 'dead':
              expected_action, expected_patch = 'restart_worker', {'worker':'alive'}
          elif projection['worker'] == 'alive' and projection['backlog'] > 0:
              expected_action, expected_patch = 'drain_backlog', {'backlog':0}
          else:
              expected_action, expected_patch = 'no_action', {}
          assert request['action'] == expected_action
          assert request['patch'] == expected_patch
          digest = hashlib.sha256(request_raw).hexdigest()
          print(json.dumps({'accepted':True,'action':request['action'],'request_sha256':digest,'producer_artifact_digest':os.environ['PRODUCER_ARTIFACT_DIGEST']}, sort_keys=True))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('accepted=true\n')
              f.write(f"action={request['action']}\n")
              f.write(f'normalized_digest={digest}\n')
          PY

  tamper_rejection:
    needs: producer
    runs-on: ubuntu-slim
    steps:
      - name: Download producer artifact
        uses: actions/download-artifact@v4
        with:
          name: q07-producer
          path: /tmp/q07
      - name: Prove stale/tampered request is rejected
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/q07')
          p=json.loads((root/'projection.json').read_text())
          good=json.loads((root/'request.json').read_text())
          cases={
            'stale_projection':{**good,'projection_id':'stale'},
            'wrong_precondition':{**good,'expected':{'worker':'dead','backlog':2}},
            'wrong_patch':{**good,'patch':{'backlog':1}},
            'forbidden_action':{**good,'action':'shell'},
            'extra_key':{**good,'ready':True},
          }
          required={'action','resource','expected','patch','projection_id'}
          def accept(r):
            if set(r)!=required:return False
            if r['projection_id']!=p['projection_id']:return False
            if r['resource']!=p['resource']:return False
            if r['expected']!={'worker':p['worker'],'backlog':p['backlog']}:return False
            if r['action'] not in p['allowed_actions']:return False
            if r['action']!='drain_backlog' or r['patch']!={'backlog':0}:return False
            return True
          for name,r in cases.items():
            result=accept(r)
            print(json.dumps({'fixture':name,'accepted':result},sort_keys=True))
            assert result is False
          print(json.dumps({'result':'PASS','tampered_rejected':len(cases)},sort_keys=True))
          PY

  mock_actuator:
    needs: [producer, receiver, tamper_rejection]
    if: needs.receiver.outputs.accepted == 'true'
    runs-on: ubuntu-slim
    permissions: {}
    steps:
      - name: Apply bounded patch to disposable local state
        shell: bash
        env:
          ACTION: ${{ needs.receiver.outputs.action }}
          REQUEST_SHA256: ${{ needs.receiver.outputs.normalized_digest }}
        run: |
          set -euo pipefail
          test "$ACTION" = 'drain_backlog'
          python3 - <<'PY'
          import json, os
          state={'worker':'alive','backlog':2}
          before=dict(state)
          state['backlog']=0
          assert state=={'worker':'alive','backlog':0}
          print(json.dumps({'result':'PASS','before':before,'after':state,'action':os.environ['ACTION'],'request_sha256':os.environ['REQUEST_SHA256']},sort_keys=True))
          PY
