name: issue-37-qualified-resolution

on:
  pull_request:
    paths:
      - 'schemas/qualified-resolution-binding-v1.schema.json'
      - 'tools/qualified_resolution.py'
      - 'tests/test_qualified_resolution.py'
      - 'docs/qualified-resolution-binding-v1.md'
      - '.github/workflows/issue-37-qualified-resolution.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-resolution-contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          check-latest: false
      - name: Install test runner
        run: python -m pip install pytest
      - name: Run retained-resolution contract tests
        run: python -m pytest tests/test_qualified_resolution.py -v
      - name: Validate schema and CLI surface
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool schemas/qualified-resolution-binding-v1.schema.json >/dev/null
          python tools/qualified_resolution.py --help >/dev/null
