name: Benchmark artifact Rep 1

on:
  pull_request:
    paths:
      - "schemas/benchmark-source-declaration.schema.json"
      - "examples/benchmarks/**"
      - "tools/validate_benchmark_declaration.py"
      - "tests/test_benchmark_declaration.py"
      - "docs/plans/benchmark-artifact-rep1.md"
      - ".github/workflows/benchmark-artifact-rep1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Validate benchmark schema and examples
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-input "jsonschema==4.25.1"
          python3 - <<'PY'
          import json
          from pathlib import Path
          import jsonschema

          schema = json.loads(Path("schemas/benchmark-source-declaration.schema.json").read_text())
          jsonschema.Draft202012Validator.check_schema(schema)
          for path in sorted(Path("examples/benchmarks").glob("*.json")):
              document = json.loads(path.read_text())
              jsonschema.validate(document, schema)
          PY

      - name: Run benchmark boundary tests
        run: python3 -m unittest discover -s tests -p 'test_benchmark_declaration.py' -v

      - name: Exercise declarations through boundary validator
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/validate_benchmark_declaration.py examples/benchmarks/visual-contract-generator.json
          python3 tools/validate_benchmark_declaration.py examples/benchmarks/open-images-v7.json

      - name: Compile validator
        run: python3 -m py_compile tools/validate_benchmark_declaration.py
