name: Verify approved Faster Whisper tiny

on:
  pull_request:
    paths:
      - ".github/workflows/verify-approved-faster-whisper-tiny.yml"
      - "catalog/approved.json"
      - "schemas/approved-catalog.schema.json"
      - "tools/hydrate.py"
  push:
    branches:
      - main
    paths:
      - "catalog/approved.json"

permissions:
  contents: read

env:
  LOGICAL_ID: asr/faster-whisper/tiny
  EXPECTED_DIGEST: sha256:f2d664ae986b0b0598037a9f0b929fd0b0b748871474a06c84658c1f2a1a4b42
  FIXTURE_COMMIT: 6e3be77e1a105e59086e3e21ff5f609fd6fa89a5

jobs:
  validate-catalog:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - name: Validate approved catalog
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-input "jsonschema==4.25.1"
          python3 - <<'PY'
          import json
          from pathlib import Path
          import jsonschema

          schema = json.loads(Path("schemas/approved-catalog.schema.json").read_text())
          catalog = json.loads(Path("catalog/approved.json").read_text())
          jsonschema.validate(catalog, schema)
          entry = catalog["artifacts"]["asr/faster-whisper/tiny"]
          assert entry["approved_digest"] == "sha256:f2d664ae986b0b0598037a9f0b929fd0b0b748871474a06c84658c1f2a1a4b42"
          assert entry["candidate_evidence"]["commit_sha"] == "4a82c5d72dd3fef6bef3dccdace23a5c1859636c"
          PY
          python3 -m py_compile tools/hydrate.py

  hydrate-approved:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate-catalog
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Set up ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        with:
          version: 1.3.3

      - name: Install pinned ASR runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-input \
            "faster-whisper==1.2.1" \
            "ctranslate2==4.6.0"

      - name: Login to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "${GHCR_TOKEN}" | oras login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

      - name: Hydrate fresh cache by approved digest
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/foundry-cache
          python3 tools/hydrate.py \
            --catalog catalog/approved.json \
            --id "${LOGICAL_ID}" \
            --cache-root /tmp/foundry-cache
          test -f /tmp/foundry-cache/selected/asr__faster-whisper__tiny.json

      - name: Prove second hydration is offline/idempotent
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/hydrate.py \
            --catalog catalog/approved.json \
            --id "${LOGICAL_ID}" \
            --cache-root /tmp/foundry-cache \
            --oras /bin/false

      - name: Prove consumer can run from hydrated local directory
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/openai/whisper/${FIXTURE_COMMIT}/tests/jfk.flac" \
            --output /tmp/jfk.flac
          export HF_HUB_OFFLINE=1
          export TRANSFORMERS_OFFLINE=1
          python3 - <<'PY'
          import json
          from pathlib import Path
          from faster_whisper import WhisperModel

          selected = json.loads(Path("/tmp/foundry-cache/selected/asr__faster-whisper__tiny.json").read_text())
          assert selected["digest"] == "sha256:f2d664ae986b0b0598037a9f0b929fd0b0b748871474a06c84658c1f2a1a4b42"
          model_dir = Path(selected["model_dir"])
          assert model_dir.is_dir()
          model = WhisperModel(str(model_dir), device="cpu", compute_type="int8", local_files_only=True)
          segments, info = model.transcribe("/tmp/jfk.flac", language="en", beam_size=1)
          text = "".join(segment.text for segment in segments).strip().lower()
          for phrase in ("my fellow americans", "your country", "do for you"):
              assert phrase in text, (phrase, text)
          assert info.language == "en"
          print(json.dumps({"hydrated_digest": selected["digest"], "model_dir": str(model_dir), "asr": "passed"}))
          PY

      - name: Record BHADA-use proof
        shell: bash
        run: |
          {
            echo "## Approved artifact is consumer-ready"
            echo
            echo "- logical ID: \`${LOGICAL_ID}\`"
            echo "- digest: \`${EXPECTED_DIGEST}\`"
            echo "- fresh digest-pinned hydration: passed"
            echo "- second hydration with ORAS disabled: passed"
            echo "- local-only Faster Whisper JFK smoke: passed"
          } >> "${GITHUB_STEP_SUMMARY}"
