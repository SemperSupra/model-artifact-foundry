name: issue-31-qualification-receipt

on:
  pull_request:
    paths:
      - 'schemas/qualification-receipt-v1.schema.json'
      - 'fixtures/qualification/**'
      - 'tools/qualification_receipt.py'
      - 'tests/test_qualification_receipt.py'
      - 'docs/qualification-receipt-v1.md'
      - '.github/workflows/issue-31-qualification-receipt.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          check-latest: false
      - name: Install test runner
        run: python -m pip install pytest
      - name: Run receipt contract tests
        run: python -m pytest tests/test_qualification_receipt.py -v
      - name: Prove CLI byte repeatability and validation
        shell: bash
        run: |
          set -euo pipefail
          first="$RUNNER_TEMP/qualification-first.json"
          second="$RUNNER_TEMP/qualification-second.json"
          fixture="fixtures/qualification/kv-ground-qualification-draft.example.json"
          python tools/qualification_receipt.py --input "$fixture" --output "$first"
          python tools/qualification_receipt.py --input "$fixture" --output "$second"
          cmp "$first" "$second"
          python tools/qualification_receipt.py --input "$first" --validate-existing >/dev/null
          python -m json.tool schemas/qualification-receipt-v1.schema.json >/dev/null
