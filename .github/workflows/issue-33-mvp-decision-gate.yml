name: issue-33-mvp-decision-gate

on:
  pull_request:
    paths:
      - 'schemas/mvp-decision-evidence-v1.schema.json'
      - 'fixtures/decision/**'
      - 'tools/check_mvp_decision_readiness.py'
      - 'tests/test_mvp_decision_readiness.py'
      - 'docs/mvp-go-narrow-kill-gate.md'
      - '.github/workflows/issue-33-mvp-decision-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-gate-contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          check-latest: false
      - name: Install test runner
        run: python -m pip install pytest
      - name: Run frozen gate tests
        run: python -m pytest tests/test_mvp_decision_readiness.py -v
      - name: Prove fixture is READY without making an authority decision
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/readiness.json"
          python tools/check_mvp_decision_readiness.py \
            --input fixtures/decision/first-consumer-ready.example.json \
            --output "$output"
          python - "$output" <<'PY'
          import json, pathlib, sys
          result = json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert result["decision_readiness"] == "READY"
          assert result["go_mechanical_eligible"] is True
          assert "decision" not in result
          assert "GO" in result["authority_note"]
          PY
          python -m json.tool schemas/mvp-decision-evidence-v1.schema.json >/dev/null
