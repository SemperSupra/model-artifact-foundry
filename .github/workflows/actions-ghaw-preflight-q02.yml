name: Actions gh-aw engine preflight Q0.2

on:
  push:
    branches:
      - exp/actions-ghaw-preflight-q02-20260908

permissions:
  contents: read

jobs:
  preflight-only:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install gh-aw
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh extension install github/gh-aw
          gh aw version

      - name: Read-only engine and repository preflight
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          mkdir -p q02 .github/workflows
          cat > .github/workflows/q02-agentic.md <<'EOF'
          ---
          on:
            workflow_dispatch:
          permissions:
            contents: read
          engine: copilot
          ---

          Inspect repository state read-only. Produce no external writes.
          EOF

          gh aw compile .github/workflows/q02-agentic.md >q02/compile.txt 2>&1
          echo "compile_exit=$?" | tee q02/status.txt

          gh aw doctor --repo "${GITHUB_REPOSITORY}" --dir "${GITHUB_WORKSPACE}" --json >q02/doctor.json 2>q02/doctor.err
          echo "doctor_exit=$?" | tee -a q02/status.txt

          gh aw forecast q02-agentic --repo "${GITHUB_REPOSITORY}" --days 7 --sample 1 --json >q02/forecast.json 2>q02/forecast.err
          echo "forecast_exit=$?" | tee -a q02/status.txt

          gh aw models >q02/models.txt 2>&1
          echo "models_exit=$?" | tee -a q02/status.txt

          printf '\n--- doctor ---\n'; sed -n '1,220p' q02/doctor.json; sed -n '1,120p' q02/doctor.err
          printf '\n--- forecast ---\n'; sed -n '1,220p' q02/forecast.json; sed -n '1,120p' q02/forecast.err
          printf '\n--- models ---\n'; sed -n '1,100p' q02/models.txt
          printf '\n--- status ---\n'; cat q02/status.txt
          exit 0

      - uses: actions/upload-artifact@v4
        with:
          name: ghaw-preflight-q02
          path: q02/
